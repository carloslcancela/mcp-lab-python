[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-lab-python"
version = "0.1.0"
description = "Laboratorio modular para aprendizado de MCP com Python"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[tool.setuptools.packages.find]
include = ["modules*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]